<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>screensnap — permission</title>
    <style>
      @font-face { font-family: 'Geist'; font-weight: 400; font-display: swap; src: url('../popup/fonts/geist-400.woff2') format('woff2'); }
      @font-face { font-family: 'Geist'; font-weight: 600; font-display: swap; src: url('../popup/fonts/geist-600.woff2') format('woff2'); }
      html, body { margin: 0; height: 100%; }
      body { font-family: 'Geist', system-ui, -apple-system, sans-serif; background: #0b0b0c; color: #e5e7eb;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 22px; text-align: center; }
      .dot { width: 44px; height: 44px; border-radius: 50%; background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.4);
        display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 16px; font-weight: 600; margin: 0; }
      p { font-size: 13px; line-height: 1.5; color: #9ca3af; margin: 0; max-width: 320px; }
      #status { font-size: 12px; color: #6b7280; min-height: 16px; }
    </style>
  </head>
  <body>
    <div class="dot">
      <svg id="icon-mic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      <svg id="icon-cam" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
      </svg>
    </div>
    <h1 id="title">Allow access</h1>
    <p id="desc">screensnap records locally so it can be added to your recordings. Click <b>Allow</b> in the prompt — this window closes itself.</p>
    <div id="status">Requesting…</div>
    <script type="module" src="media.js"></script>
  </body>
</html>
