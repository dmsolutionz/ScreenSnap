<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>screensnap — video editor</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <div id="empty" class="ss-empty">
    <div class="ss-empty-card">
      <div class="ss-wordmark">screensnap<span class="ss-dot">.</span></div>
      <div class="ss-empty-sub">Video editor</div>
      <p class="ss-empty-text" id="empty-text">Revise a recording or any video, or build a new one from clips — all on your machine.</p>

      <div class="ss-home-actions" id="home-actions">
        <button id="open-btn" class="ss-home-card" type="button">
          <span class="ss-home-t">Open video</span>
          <span class="ss-home-d">MP4 · WebM · MOV — or drop a file here</span>
        </button>
        <button id="new-btn" class="ss-home-card" type="button">
          <span class="ss-home-t">New project</span>
          <span class="ss-home-d">Blank canvas, or clips laid end to end</span>
        </button>
      </div>

      <form id="new-form" class="ss-new" hidden>
        <label class="ss-new-row"><span>Format</span><select id="np-format" class="ss-select"></select></label>
        <label class="ss-new-row" id="np-length-row"><span>Length</span><select id="np-length" class="ss-select"></select></label>
        <label class="ss-new-row"><span>Background</span><select id="np-bg" class="ss-select"></select></label>
        <div class="ss-new-row ss-new-clips">
          <span>Clips</span>
          <button id="np-add-clips" class="ss-btn ss-btn-sm" type="button">+ Add clips…</button>
        </div>
        <ol id="np-clip-list" class="ss-new-list"></ol>
        <p class="ss-new-hint" id="np-hint">Optional. Clips play one after another and set the project's length; green-screen clips are keyed automatically.</p>
        <div class="ss-new-actions">
          <button id="np-cancel" class="ss-btn ss-btn-ghost" type="button">Cancel</button>
          <button id="np-create" class="ss-btn ss-btn-primary" type="submit">Create project</button>
        </div>
      </form>

      <div id="recent" class="ss-recent" hidden>
        <div class="ss-recent-h">Recent recordings</div>
        <div id="recent-list" class="ss-recent-list"></div>
      </div>
    </div>
    <div id="drop-hint" class="ss-drop" hidden><div>Drop a video to open it</div></div>
  </div>
  <div id="root" class="ss-root" style="display:none"></div>
  <script type="module" src="editor.js"></script>
</body>
</html>
