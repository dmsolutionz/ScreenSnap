<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>screensnap · recorder</title>
    <style>
      @font-face { font-family: 'Geist'; font-weight: 500; src: url('../popup/fonts/geist-500.woff2') format('woff2'); }
      @font-face { font-family: 'Geist'; font-weight: 600; src: url('../popup/fonts/geist-600.woff2') format('woff2'); }
      @font-face { font-family: 'Geist Mono'; font-weight: 500; src: url('../popup/fonts/geist-mono-500.woff2') format('woff2'); }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body { background: #0a0a0a; color: #fff; font-family: 'Geist', system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; }
      .prim:hover { background: #16a34a !important; }
      .stop:hover { background: rgba(239,68,68,0.18) !important; }
      .ghost:hover { background: rgba(255,255,255,0.06) !important; }
      @keyframes pingRing { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(2.6); opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="recorder.js"></script>
  </body>
</html>
